[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psf_grids"
version = "0.1.0"
description = "Package for handling gridded PSFs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # The numpy constraint is to handle grism_sim dependencies
    "numpy<2",
    "stpsf>=2.1,<3",
    # The pillow constraint is to handle grizli constraints...
    "pillow<11.3"
]

[tool.setuptools.packages.find]
where = ["py"]

[tool.setuptools.package-dir]
"" = "py"
